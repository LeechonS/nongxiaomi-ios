name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  core-tests:
    name: 核心协议测试(macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 跑 NongXiaoMiCore 回归测试
        run: cd core && swift test

  build-ipa:
    name: 打未签名IPA(供侧载)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 环境信息(Xcode版本+可用scheme)
        run: |
          xcodebuild -version
          cd app && xcodebuild -list
      - name: xcodebuild 构建(不签名)
        run: |
          cd app
          # build模式(非archive): SwiftPM的archive不产出.app, build稳定产出DerivedData里的.app
          xcodebuild -scheme NongXiaoMiApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ../derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            GENERATE_INFOPLIST_FILE=YES \
            PRODUCT_BUNDLE_IDENTIFIER=com.nongxiaomi.app \
            INFOPLIST_KEY_CFBundleDisplayName=农小秘 \
            INFOPLIST_KEY_UILaunchScreen_Generation=YES \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone=UIInterfaceOrientationPortrait \
            INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads=YES \
            build > ../build.log 2>&1 || { echo "=== 构建失败, 日志尾部 ==="; tail -60 ../build.log; exit 1; }
      - name: 失败时上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure.log
          path: build.log
      - name: 失败时把构建日志传回开发服务器
        if: failure()
        run: curl -s --max-time 30 -X POST --data-binary @build.log http://111.228.62.13:8910/devlog || true
      - name: 打包IPA
        run: |
          set -o pipefail
          {
            set -x
            P=derived/Build/Products/Release-iphoneos
            echo "--- 构建产物 ---"
            ls -la "$P"
            test -f "$P/NongXiaoMiApp"
            # SwiftPM的executableTarget只产裸可执行文件, 手工组装iOS .app包
            mkdir -p ipa/NongXiaoMiApp.app
            cp "$P/NongXiaoMiApp" ipa/NongXiaoMiApp.app/NongXiaoMiApp
            cat > ipa/NongXiaoMiApp.app/Info.plist <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
    <key>CFBundleExecutable</key><string>NongXiaoMiApp</string>
    <key>CFBundleIdentifier</key><string>com.nongxiaomi.app</string>
    <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
    <key>CFBundleName</key><string>农小秘</string>
    <key>CFBundleDisplayName</key><string>农小秘</string>
    <key>CFBundlePackageType</key><string>APPL</string>
    <key>CFBundleShortVersionString</key><string>1.0</string>
    <key>CFBundleVersion</key><string>1</string>
    <key>UILaunchScreen</key><dict/>
    <key>UISupportedInterfaceOrientations</key>
    <array><string>UIInterfaceOrientationPortrait</string></array>
    <key>NSAppTransportSecurity</key>
    <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
    <key>UIRequiredDeviceCapabilities</key>
    <array><string>arm64</string></array>
</dict>
</plist>
PLIST
            printf 'APPL????' > ipa/NongXiaoMiApp.app/PkgInfo
            mkdir -p ipa
            ditto -c -k --sequesterRsrc ipa/NongXiaoMiApp.app ipa/NongXiaoMi.ipa
            rm -rf ipa/NongXiaoMiApp.app
            echo "--- IPA内容 ---"
            unzip -l ipa/NongXiaoMi.ipa | head -15
            ls -la ipa/
          } 2>&1 | tee pkg.log
      - name: 把打包日志传回开发服务器(无论成败)
        if: always()
        run: curl -s --max-time 30 -X POST --data-binary @pkg.log http://111.228.62.13:8910/devlog || echo "日志上传失败(不影响)"
      - name: 上传IPA产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NongXiaoMi.ipa
          path: ipa/NongXiaoMi.ipa
