name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  core-tests:
    name: 核心协议测试(macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 跑 NongXiaoMiCore 回归测试
        run: cd core && swift test

  build-ipa:
    name: 打未签名IPA(供侧载)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 环境信息(Xcode版本+可用scheme)
        run: |
          xcodebuild -version
          cd app && xcodebuild -list
      - name: xcodebuild 归档(不签名)
        run: |
          cd app
          xcodebuild -scheme NongXiaoMiApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ../build/NongXiaoMi \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            GENERATE_INFOPLIST_FILE=YES \
            PRODUCT_BUNDLE_IDENTIFIER=com.nongxiaomi.app \
            INFOPLIST_KEY_CFBundleDisplayName=农小秘 \
            INFOPLIST_KEY_UILaunchScreen_Generation=YES \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone=UIInterfaceOrientationPortrait \
            INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads=YES \
            archive > ../build.log 2>&1 || { echo "=== xcodebuild失败, 日志尾部 ==="; tail -60 ../build.log; exit 1; }
      - name: 失败时上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure.log
          path: build.log
      - name: 失败时把构建日志传回开发服务器
        if: failure()
        run: curl -s --max-time 30 -X POST --data-binary @build.log http://111.228.62.13:8910/devlog || true
      - name: 压缩成IPA
        run: |
          set -o pipefail
          {
            set -x
            echo "--- 仓库里所有 .app ---"
            find . -name "*.app" -not -path "*/DerivedData/*" 2>/dev/null | head
            ARCHIVE=$(find . -name "*.xcarchive" -not -path "*/DerivedData/*" 2>/dev/null | head -1)
            echo "ARCHIVE=$ARCHIVE"
            APP=$(find "$ARCHIVE" -name "*.app" 2>/dev/null | head -1)
            echo "APP=$APP"
            test -n "$APP"
            mkdir -p ipa
            ditto -c -k --sequesterRsrc "$APP" ipa/NongXiaoMi.ipa
            ls -la ipa/
          } 2>&1 | tee pkg.log
      - name: 把打包日志传回开发服务器(无论成败)
        if: always()
        run: curl -s --max-time 30 -X POST --data-binary @pkg.log http://111.228.62.13:8910/devlog || echo "日志上传失败(不影响)"
      - name: 上传IPA产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NongXiaoMi.ipa
          path: ipa/NongXiaoMi.ipa
